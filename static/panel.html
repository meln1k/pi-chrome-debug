<!doctype html>
<meta charset="utf-8" />
<title>Pi Debugger</title>
<style>
	:root { color-scheme: light; --bg: #fff; --panel: #f7f7f5; --line: #e2e2de; --line2: #c4c4bf; --fg: #1d1f1e; --dim: #6b716f; --accent: #1d1f1e; }
	body { margin: 0; font: 13px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; height: 100vh; }
	select, input { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; outline: none; }
	select:focus, input:focus { border-color: var(--line2); }
	.icon { width: 30px; height: 30px; flex: none; display: grid; place-items: center; background: none; color: var(--dim); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
	.icon:hover { color: var(--fg); border-color: var(--line2); }
	header { display: flex; gap: 6px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); }
	#chats { flex: 1; min-width: 0; }

	#log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
	#log > * { white-space: pre-wrap; word-break: break-word; }
	.user { background: #edf1f5; align-self: flex-end; max-width: 85%; border-radius: 14px; padding: 8px 12px; }
	.assistant { padding: 0 2px; }
	.tool, .result, .thinking { color: var(--dim); }
	.tool, .result { font: 11px/1.4 ui-monospace, monospace; }
	.thinking { font-style: italic; border-left: 2px solid var(--line2); padding-left: 10px; }
	.run { color: var(--dim); font: 11px/1.4 ui-monospace, monospace; }
	.run > summary { color: var(--dim); }
	.run > summary:hover, .run[open] > summary { color: var(--fg); }
	.run > *:not(summary) { margin: 6px 0 0 12px; }
	summary { cursor: pointer; font-style: normal; }
	summary:hover { color: var(--fg); }
	.error { color: #b00020; }
	pre { margin: 4px 0 0; padding: 8px; max-height: 300px; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
	.empty { margin: auto; color: var(--dim); text-align: center; }

	.composer { margin: 0 10px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 12px 10px 8px 14px; display: flex; flex-direction: column; gap: 4px; }
	.composer:focus-within { border-color: var(--line2); }
	textarea { background: none; border: 0; outline: 0; color: var(--fg); resize: none; font: inherit; field-sizing: content; min-height: 3lh; max-height: 12lh; padding: 0; }
	textarea::placeholder { color: #9a9f9d; }
	.row { display: flex; align-items: center; gap: 8px; }
	#thinking { border: 0; background: none; color: var(--dim); padding: 4px 2px; cursor: pointer; }
	#status { margin-left: auto; color: var(--dim); }
	#send { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; display: grid; place-items: center; cursor: pointer; }
	#send:disabled { opacity: 0.3; cursor: default; }
	body[data-busy] #send .go, body:not([data-busy]) #send .halt { display: none; }

	dialog { background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 14px; width: min(90vw, 360px); padding: 16px; }
	dialog::backdrop { background: #0003; }
	dialog form { display: flex; flex-direction: column; gap: 12px; }
	dialog h2 { margin: 0; font-size: 15px; }
	label { display: flex; flex-direction: column; gap: 4px; color: var(--dim); font-size: 12px; }
	label a { color: var(--dim); }
	#done { align-self: flex-end; background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 6px 16px; font: inherit; cursor: pointer; }
</style>
<header>
	<select id="chats" aria-label="Recent chats"></select>
	<button id="new" class="icon" title="New chat" aria-label="New chat">
		<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10" /></svg>
	</button>
	<button id="settings-btn" class="icon" title="Settings" aria-label="Settings">
		<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 4h7M13 4h1M2 12h1M7 12h7" /><circle cx="11" cy="4" r="2" /><circle cx="5" cy="12" r="2" /></svg>
	</button>
</header>
<div id="log"></div>
<div class="composer">
	<textarea id="input" placeholder="Ask about this page…" aria-label="Message"></textarea>
	<div class="row">
		<select id="thinking" aria-label="Thinking level" title="Thinking level"></select>
		<span id="status"></span>
		<button id="send" aria-label="Send">
			<svg class="go" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" /></svg>
			<svg class="halt" width="14" height="14" viewBox="0 0 14 14"><rect x="1" y="1" width="12" height="12" rx="2" fill="currentColor" /></svg>
		</button>
	</div>
</div>
<dialog id="settings">
	<form method="dialog">
		<h2>Settings</h2>
		<label>Provider
			<select id="provider"><option value="openrouter">OpenRouter</option><option value="opencode-go">OpenCode Go</option></select>
		</label>
		<label>API key
			<input id="key" type="password" autocomplete="off" />
		</label>
		<label>Model
			<select id="model"></select>
		</label>
		<button id="done">Done</button>
	</form>
</dialog>
<script type="module" src="panel.js"></script>
