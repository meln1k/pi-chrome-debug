<!doctype html><title>Wasm save</title>
<button id="save">Save</button>
<script>
// run = wasm-function[2] -> wasm-function[1] -> import env.save (wasm-function[0]) -> localStorage.setItem
const bytes = new Uint8Array([
  0x00, 0x61, 0x73, 0x6d, 0x01, 0x00, 0x00, 0x00,
  0x01, 0x04, 0x01, 0x60, 0x00, 0x00,                                     // type: () -> ()
  0x02, 0x0c, 0x01, 0x03, 0x65, 0x6e, 0x76, 0x04, 0x73, 0x61, 0x76, 0x65, 0x00, 0x00, // import env.save
  0x03, 0x03, 0x02, 0x00, 0x00,                                           // funcs 1, 2
  0x07, 0x07, 0x01, 0x03, 0x72, 0x75, 0x6e, 0x00, 0x02,                   // export run = 2
  0x0a, 0x0b, 0x02, 0x04, 0x00, 0x10, 0x00, 0x0b, 0x04, 0x00, 0x10, 0x01, 0x0b, // 1: call 0; 2: call 1
]);
WebAssembly.instantiate(bytes, { env: { save: () => localStorage.setItem("save", "slot-" + Date.now()) } }).then(({ instance }) => {
  instance.exports.run(); // autosave at boot
  document.getElementById("save").onclick = () => instance.exports.run();
});
</script>
